<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Todo Assistant</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-topbar">
        <div>
          <p id="today-date" class="topbar-date">오늘</p>
          <h1>오늘 브리핑</h1>
        </div>
        <button id="auth-button" class="text-button">Google 로그인</button>
      </header>

      <main class="app-main">
        <section id="auth-empty" class="empty-panel">
          <span class="status-pill">Assistant</span>
          <h2>모바일에서 오늘 할 일을 바로 확인하세요.</h2>
          <p>같은 Google 계정으로 로그인하면 웹에서 만든 일정과 할 일을 앱에서 이어서 볼 수 있습니다.</p>
        </section>

        <section id="content-shell" class="content-shell hidden">
          <section id="today-view" class="view-panel"></section>

          <section id="voice-view" class="view-panel hidden">
            <div class="section-heading">
              <h2>음성 등록</h2>
              <p>일정, 할 일, 노트 내용을 말로 빠르게 남기는 화면입니다.</p>
            </div>
            <div class="voice-panel">
              <button id="voice-primary-btn" class="voice-record-btn" type="button">말하기</button>
              <p>예: 내일 오후 3시에 병원 예약 추가해줘</p>
              <form id="quick-add-form" class="quick-form">
                <label>
                  <span>할 일</span>
                  <input id="quick-add-text" type="text" placeholder="발표 자료 검토" required />
                </label>
                <div class="form-grid">
                  <label>
                    <span>마감</span>
                    <input id="quick-add-deadline" type="date" />
                  </label>
                  <label>
                    <span>난이도</span>
                    <select id="quick-add-difficulty">
                      <option value="상">상</option>
                      <option value="중" selected>중</option>
                      <option value="하">하</option>
                    </select>
                  </label>
                </div>
                <button type="submit" class="primary-btn">일정 추가</button>
              </form>
            </div>
          </section>

          <section id="notes-view" class="view-panel hidden">
            <div class="section-heading">
              <h2>노트</h2>
              <p>녹음 노트와 웹 노트 요약을 모바일에서 빠르게 확인할 자리입니다.</p>
            </div>
            <div id="notes-list" class="empty-panel compact">
              <p>아직 모바일 노트 목록은 연결 전입니다. 다음 단계에서 녹음 전사와 요약 노트를 붙이면 됩니다.</p>
            </div>
          </section>

          <section id="calendar-view" class="view-panel hidden">
            <div class="calendar-panel">
              <div class="calendar-toolbar">
                <button id="calendar-prev" class="icon-btn" type="button" aria-label="이전">‹</button>
                <div>
                  <p>캘린더</p>
                  <strong id="calendar-label"></strong>
                </div>
                <button id="calendar-next" class="icon-btn" type="button" aria-label="다음">›</button>
              </div>
              <div class="calendar-mode-switch">
                <button class="mode-btn active" data-mode="week" type="button">주간</button>
                <button class="mode-btn" data-mode="month" type="button">월간</button>
              </div>
              <div id="calendar-grid"></div>
            </div>
          </section>
        </section>
      </main>

      <nav id="bottom-nav" class="bottom-nav hidden" aria-label="주요 화면">
        <button class="bottom-nav__item active" data-view="today" type="button">오늘</button>
        <button class="bottom-nav__item" data-view="voice" type="button">음성</button>
        <button class="bottom-nav__item" data-view="notes" type="button">노트</button>
        <button class="bottom-nav__item" data-view="calendar" type="button">캘린더</button>
      </nav>

      <button id="fab" class="voice-fab hidden" type="button" aria-label="음성으로 일정 등록">말하기</button>
    </div>

    <div id="task-modal" class="modal hidden" aria-hidden="true">
      <div class="modal__backdrop" data-close-modal="true"></div>
      <div class="modal__sheet">
        <div class="modal__header">
          <div>
            <p>일정 편집</p>
            <h2>할 일 수정</h2>
          </div>
          <button type="button" class="icon-btn" data-close-modal="true" aria-label="닫기">×</button>
        </div>
        <form id="task-edit-form" class="quick-form">
          <input id="edit-task-id" type="hidden" />
          <label>
            <span>할 일</span>
            <input id="edit-task-text" type="text" required />
          </label>
          <div class="form-grid">
            <label>
              <span>마감</span>
              <input id="edit-task-deadline" type="date" />
            </label>
            <label>
              <span>난이도</span>
              <select id="edit-task-difficulty">
                <option value="상">상</option>
                <option value="중">중</option>
                <option value="하">하</option>
              </select>
            </label>
          </div>
          <div class="form-actions">
            <button type="button" id="delete-task-btn" class="danger-btn">삭제</button>
            <button type="submit" class="primary-btn">저장</button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
